services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: ai-eos-postgres
    environment:
      POSTGRES_USER: aieos
      POSTGRES_PASSWORD: aieos_dev
      POSTGRES_DB: aieos
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: ai-eos-redis
    ports: ["6379:6379"]
volumes:
  pgdata:
