[project]
name = "ai-eos-api"
version = "5.16.1"
description = "AI-EOS Backend API"
license = "BUSL-1.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.6",
    # env_loader 依赖它把 .env 注入 os.environ（此前漏声明，
    # 导致"只在 .env 配密钥 → os.environ 取到空串"）
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.28",
    "python-multipart>=0.0.17",
    "redis>=5.2",
    "bcrypt<4",
    "playwright>=1.62.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.15.0",
    "pywebpush>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # 覆盖率门禁：CI 会对 app/api/routes + app/core 出报告并卡下限
    "pytest-cov>=7",
    "aiosqlite>=0.20",
    # 静态检查：把"未定义名"这类会让整块功能静默失效的问题拦在提交前
    "pyflakes>=3.2",
]

# ---------------------------------------------------------------------------
# pytest 配置
#
# 为什么只跑 tests/：仓库根目录的 ../tests/ 是改造前遗留的 28 个手工脚本，
# 它们依赖 /tmp/aieos_token 与硬编码的真实数据库 UUID，只有本机特定环境
# 才能运行（pytest 收集时直接报错）。见 ../tests/LEGACY_SCRIPTS.md。
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# 测试函数的 loop 默认按用例隔离（SQLite 路径依赖这一行为，见 conftest 说明）。
# Postgres job 会额外传 `-o asyncio_default_test_loop_scope=session`：
# asyncpg 的连接池不能跨事件循环复用，见 .github/workflows/ci.yml 的 postgres job。
addopts = "-q --strict-markers"
markers = [
    "requires_llm: 需要真实模型密钥才能运行的端到端用例（无密钥时自动跳过）",
    "known_leak: 双租户探针已确认的真实越权点；运行时 xfail，修复后应删除标记与 allowlist 条目",
    "known_bug: 探针暴露的实现缺陷（如 500），不是越权但同样必须修",
]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]

# ---------------------------------------------------------------------------
# 覆盖率
#
# CI（.github/workflows/ci.yml 的 backend job）用：
#   pytest --cov=app --cov-report=term-missing --cov-fail-under=<与下面同步>
# 统计范围是整个 app 包（不再只是 routes + core）。
#
# 阈值来历（2026-11-01 实测）：`pytest --cov=app` 为 **69.8%**（21822 行，
# 缺 6584）。此前的 46%~48% 是测量口径错误：SQLAlchemy async 在 await 边界
# 交给 greenlet，不配 concurrency 会系统性丢追踪（同文件 67% vs 99%）。
# fail_under 取 **65**：比实测低约 5 个点，覆盖后台任务线程带来的时序抖动，
# 不会造成假红。调阈值前必须先本地跑一遍实测，且只能往上调。
# 不要把 --cov 塞进 addopts：单跑一个测试文件时覆盖率天然很低，
# 会让人误以为代码坏了；覆盖率是整套件的门禁，不是单文件的。
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = [
    "app/__init__.py",
    "*/__pycache__/*",
]
# SQLAlchemy async 在 await 边界把控制权交给 greenlet，默认 tracer 会跟丢：
# 同一条路由实测 67% vs 99%、33% vs 100%。不配这项，覆盖率会被系统性低估。
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 65
