[project]
name = "ai-eos-api"
version = "5.12.0"
description = "AI-EOS Backend API"
license = "BUSL-1.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.6",
    # env_loader 依赖它把 .env 注入 os.environ（此前漏声明，
    # 导致"只在 .env 配密钥 → os.environ 取到空串"）
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.28",
    "python-multipart>=0.0.17",
    "redis>=5.2",
    "bcrypt<4",
    "playwright>=1.62.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # 覆盖率门禁：CI 会对 app/api/routes + app/core 出报告并卡下限
    "pytest-cov>=7",
    "aiosqlite>=0.20",
    # 静态检查：把"未定义名"这类会让整块功能静默失效的问题拦在提交前
    "pyflakes>=3.2",
]

# ---------------------------------------------------------------------------
# pytest 配置
#
# 为什么只跑 tests/：仓库根目录的 ../tests/ 是改造前遗留的 28 个手工脚本，
# 它们依赖 /tmp/aieos_token 与硬编码的真实数据库 UUID，只有本机特定环境
# 才能运行（pytest 收集时直接报错）。见 ../tests/LEGACY_SCRIPTS.md。
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-q --strict-markers"
markers = [
    "requires_llm: 需要真实模型密钥才能运行的端到端用例（无密钥时自动跳过）",
    "known_leak: 双租户探针已确认的真实越权点；运行时 xfail，修复后应删除标记与 allowlist 条目",
    "known_bug: 探针暴露的实现缺陷（如 500），不是越权但同样必须修",
]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]

# ---------------------------------------------------------------------------
# 覆盖率
#
# CI（.github/workflows/ci.yml）用：
#   pytest --cov=app/api/routes --cov=app/core --cov-report=term-missing \
#          --cov-fail-under=<见下面的 fail_under>
# 阈值按"实测值向下取整到 5 的倍数"设定，只允许往上调。
# 不要把 --cov 塞进 addopts：单跑一个测试文件时覆盖率天然很低，
# 会让人误以为代码坏了；覆盖率是整套件的门禁，不是单文件的。
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = [
    "app/__init__.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
