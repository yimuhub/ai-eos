# AI-EOS 多平台客户端流水线（V5.1）
# 产出：Mac(dmg+zip) / Windows(nsis+portable) / Linux(AppImage+deb) / Android(发布版 APK)
# 触发：手动（workflow_dispatch）或 push 标签 clients-*
name: clients

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release 标签（留空自动生成 clients-<日期>）"
        required: false
        default: ""
  push:
    tags:
      - "clients-*"

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 桌面：macOS ----------
  desktop-mac:
    runs-on: macos-latest   # Apple Silicon runner，x64/arm64 双架构
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装依赖
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: 构建 dmg + zip（x64/arm64）
        working-directory: desktop
        run: npx electron-builder --mac
      - name: 收集产物
        run: |
          mkdir -p out/mac
          cp desktop/dist/AI-EOS-*.dmg desktop/dist/AI-EOS-*.zip out/mac/ 2>/dev/null || cp desktop/dist/*.dmg desktop/dist/*.zip out/mac/ 2>/dev/null
          ls -lh out/mac/
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: out/mac
          retention-days: 14

  # ---------- 桌面：Windows ----------
  desktop-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装依赖
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: 构建 NSIS 安装器 + portable 绿色版
        working-directory: desktop
        run: npx electron-builder --win
      - name: 收集产物
        run: |
          New-Item -ItemType Directory -Force out/win | Out-Null
          Copy-Item desktop\dist\*.exe out/win/ -ErrorAction SilentlyContinue
          Get-ChildItem out/win | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: out/win
          retention-days: 14

  # ---------- 桌面：Linux ----------
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装依赖
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: 构建 AppImage + deb
        working-directory: desktop
        run: npx electron-builder --linux
      - name: 收集产物
        run: |
          mkdir -p out/linux
          cp desktop/dist/*.AppImage desktop/dist/*.deb out/linux/ 2>/dev/null
          ls -lh out/linux/
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: out/linux
          retention-days: 14

  # ---------- Android：发布版 APK（自签 p12） ----------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 安装依赖
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: expo prebuild 生成原生工程
        working-directory: mobile
        run: npx expo prebuild -p android --no-install
      - name: 注入 release 签名配置（p12 自签）
        working-directory: mobile/android
        run: |
          python3 - <<'PY'
          import re, pathlib
          g = pathlib.Path("app/build.gradle")
          s = g.read_text()
          # 已有 signingConfigs 则跳过
          if "signingConfigs" not in s:
              # 在 android { 内追加 signingConfigs + buildTypes.release 引用
              anchor = "buildTypes {"
              i = s.index(anchor)
              block = (
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            storeFile file('../../packaging/keystore/ai-eos.p12')\n"
                  "            storeType 'p12'\n"
                  "            storePassword 'aieos2026'\n"
                  "            keyAlias 'aieos'\n"
                  "            keyPassword 'aieos2026'\n"
                  "        }\n"
                  "    }\n"
              )
              # 插到 buildTypes 块前
              s = s[:i] + block + s[i:]
              # release 加 signingConfig
              s = s.replace("release {", "release {\n                signingConfig signingConfigs.release", 1)
          g.write_text(s)
          print("build.gradle 签名配置注入完成")
          PY
      - name: gradle 构建 release APK
        working-directory: mobile/android
        run: |
          yes | ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: 收集 APK
        run: |
          mkdir -p out/android
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/android/AI-EOS-Android-v5.1.0.apk"
          ls -lh out/android/
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/android
          retention-days: 30

  # ---------- 汇总：发 Release + 挂全部安装包 ----------
  release:
    needs: [desktop-mac, desktop-win, desktop-linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 定标签
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="clients-$(date +%Y%m%d)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: 创建 Release 并附安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: yimuhub/ai-eos
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          API="https://api.github.com/repos/$REPO"
          # 展平产物到 release-files/（文件名去重）
          mkdir -p release-files
          find artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.apk" \) \
            -exec sh -c 'f="${1}"; b="$(basename "$f")"; n=1; while [ -e "release-files/$b" ]; do base="${b%.${b##*.}}"; ext="${b##*.}"; b="${base}-${n}.${ext}"; n=$((n+1)); done; cp "$f" "release-files/$b"' _ {} \;
          ls -lh release-files/
          # 组装 notes 文件
          cat > release-notes.md <<'EOF'
          ## AI-EOS V5.1 客户端

          | 平台 | 文件 | 安装方式 |
          |---|---|---|
          | macOS (Apple Silicon / Intel) | .dmg / .zip | 拖入「应用程序」；自签需右键→打开（或 系统设置→隐私与安全性→仍要打开） |
          | Windows | AI-EOS Setup *.exe (NSIS) / AI-EOS-*.exe (绿色版) | 双击安装 / 解压直接运行；SmartScreen 点「仍要运行」 |
          | Linux | .AppImage（自包含）/ .deb | chmod +x 双击 / sudo dpkg -i |
          | Android | AI-EOS-Android-v5.1.0.apk | 传到手机，允许「未知来源」后安装 |

          **桌面客户端使用说明**
          - Electron 壳：把 AI-EOS 前端装进原生窗口（界面与网页版完全一致，含全部功能页）。
          - 首次打开若显示「服务未检测到」引导页：先在你的服务器上启动 AI-EOS（便携版 / 一键部署），再点「重试连接」；远程服务点「更换服务器」填 `http://服务器IP:8000`。
          - 开发机仓库内 `npm start` 仍是自动拉起本地服务的原行为。

          **Android 使用说明**
          - 老板视角 App：KPI / 一句话下达（含📎）/ 签字门 / 服务连接。
          - 打开后到「连接」Tab 填服务器地址并登录（连接信息加密保存在手机里）。

          安装包均为内部自签（未做 Apple/Windows 公证），分发给自己/团队设备时按系统提示放行即可。
          EOF
          # 若同名 Release 已存在则先删（API）
          EXIST=$(curl -s -o /dev/null -w "%{http_code}" "$API/releases/tags/$TAG_NAME" -H "Authorization: token $GH_TOKEN")
          if [ "$EXIST" = "200" ]; then
            RID=$(curl -s "$API/releases/tags/$TAG_NAME" -H "Authorization: token $GH_TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
            curl -s -X DELETE "$API/releases/$RID" -H "Authorization: token $GH_TOKEN" -o /dev/null
            git tag -d "$TAG_NAME" 2>/dev/null || true
            git push origin ":$TAG_NAME" 2>/dev/null || true
          fi
          # 创建 Release（body 从 release-notes.md 内嵌进 JSON，避免 API 不支持 body_file）
          python3 -c "import json,os,urllib.request as u,sys; body=open('release-notes.md').read(); payload={'tag_name':os.environ['TAG_NAME'],'name':'AI-EOS V5.1 客户端（Mac/Windows/Linux/Android）','body':body,'draft':False,'prerelease':False}; req=u.Request(os.environ['API']+'/releases',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'token '+os.environ['GH_TOKEN'],'Content-Type':'application/json'}); rel=u.urlopen(req).read(); open('/tmp/release_id.txt','w').write(str(json.loads(rel)['id'])); print(rel[:300])"
          RID=$(cat /tmp/release_id.txt)
          echo "release id: $RID"
          # 逐个上传 assets（API 上传，文件名带空格也能处理）
          for f in release-files/*; do
            curl -s -X POST "$API/releases/$RID/assets?name=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$(basename "$f")")" \
              -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" -o /dev/null -w "upload $(basename "$f"): %{http_code}\n"
          done
