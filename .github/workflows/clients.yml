# AI-EOS 多平台客户端流水线（V5.1）
# 产出：Mac(dmg+zip) / Windows(nsis+portable) / Linux(AppImage+deb) / Android(发布版 APK)
# 触发：**仅手动**（workflow_dispatch）。
# 打包是 Actions 里最贵的一类任务（macOS/Windows runner × 多架构），密集开发期不随标签
# 自动触发。需要出安装包时到 Actions 页面手动 Run workflow 并填标签。
name: clients

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release 标签（留空自动生成 clients-<日期>）"
        required: false
        default: ""

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 桌面：macOS ----------
  desktop-mac:
    runs-on: macos-latest   # Apple Silicon runner，x64/arm64 双架构
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装依赖
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: 构建 dmg + zip（x64/arm64；官方签名或 ad-hoc）
        working-directory: desktop
        env:
          APPLE_CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CSC_LINK" ] && [ -n "$APPLE_CSC_KEY_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "已配置官方 Apple 签名与公证 Secrets，执行 Developer ID 签名和公证"
            export CSC_LINK="$APPLE_CSC_LINK"
            export CSC_KEY_PASSWORD="$APPLE_CSC_KEY_PASSWORD"
            npx electron-builder --mac
          elif [ -n "$APPLE_CSC_LINK" ] || [ -n "$APPLE_CSC_KEY_PASSWORD" ] || [ -n "$APPLE_ID" ] || [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -n "$APPLE_TEAM_ID" ]; then
            echo "Apple 签名 Secrets 不完整，本次仅执行 ad-hoc 构建，不签名、不公证、不安装信任根" >&2
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac
          else
            echo "未配置 Apple 签名 Secrets，本次仅执行 ad-hoc 构建，不签名、不公证、不安装信任根"
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac
          fi
      - name: 收集产物
        run: |
          mkdir -p out/mac
          cp desktop/dist/AI-EOS-*.dmg desktop/dist/AI-EOS-*.zip out/mac/ 2>/dev/null || cp desktop/dist/*.dmg desktop/dist/*.zip out/mac/ 2>/dev/null
          ls -lh out/mac/
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-mac
          path: out/mac
          retention-days: 14

  # ---------- 桌面：Windows ----------
  desktop-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装依赖
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      # 修复：win.artifactName 是 NSIS/portable 两个 target 共用的级别配置——
      # 后构建的覆盖先构建的，Release 里只剩一个 exe（5.16.1 实测只剩 setup）。
      # 拆成两步构建，portable 用 -c.artifactName 覆盖出独立命名。
      - name: 构建 NSIS 安装器（win-setup.exe）
        working-directory: desktop
        run: npx electron-builder --win nsis
      - name: 构建 portable 绿色版（win-portable.exe）
        working-directory: desktop
        run: npx electron-builder --win portable -c.artifactName="AI-EOS-${version}-win-portable.${ext}"
      - name: 收集产物
        run: |
          New-Item -ItemType Directory -Force out/win | Out-Null
          Copy-Item desktop\dist\*.exe out/win/ -ErrorAction SilentlyContinue
          Get-ChildItem out/win | Format-Table Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-win
          path: out/win
          retention-days: 14

  # ---------- 桌面：Linux ----------
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装依赖
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: 构建 AppImage + deb
        working-directory: desktop
        run: npx electron-builder --linux
      - name: 收集产物
        run: |
          mkdir -p out/linux
          cp desktop/dist/*.AppImage desktop/dist/*.deb out/linux/ 2>/dev/null
          ls -lh out/linux/
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: out/linux
          retention-days: 14

  # ---------- Android：发布版 APK（自签 p12） ----------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 安装依赖
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: expo prebuild 生成原生工程
        working-directory: mobile
        run: npx expo prebuild -p android --no-install
      - name: 校验 Secrets 并构建 release APK（运行时临时密钥库）
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少 GitHub Secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Android release 构建要求配置全部签名 Secrets；已中止，不使用仓库密钥" >&2
            exit 1
          fi
          KEYSTORE_FILE="$(mktemp "${TMPDIR:-/tmp}/aieos-android-XXXXXX.p12")"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          export ANDROID_KEYSTORE_PATH="$KEYSTORE_FILE"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          try:
              data = base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True)
          except Exception as exc:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 不是有效的 Base64") from exc
          if not data:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 解码结果为空")
          target = Path(os.environ["ANDROID_KEYSTORE_PATH"])
          target.write_bytes(data)
          target.chmod(0o600)
          PY
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle")
          source = gradle.read_text()
          if "signingConfigs" not in source:
              block = """    signingConfigs {
                  release {
                      storeFile file(providers.gradleProperty("android.injected.signing.store.file").get())
                      storePassword providers.gradleProperty("android.injected.signing.store.password").get()
                      keyAlias providers.gradleProperty("android.injected.signing.key.alias").get()
                      keyPassword providers.gradleProperty("android.injected.signing.key.password").get()
                      storeType 'p12'
                  }
              }
              """
              anchor = "buildTypes {"
              before, marker, after = source.partition(anchor)
              if not marker:
                  raise SystemExit("无法定位 Android buildTypes 配置")
              source = before.rstrip() + "\n" + block + marker + after.replace(
                  "release {",
                  "release {\n                signingConfig signingConfigs.release",
                  1,
              )
              gradle.write_text(source)
          PY
          env \
            "ORG_GRADLE_PROJECT_android.injected.signing.store.file=$KEYSTORE_FILE" \
            "ORG_GRADLE_PROJECT_android.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
            "ORG_GRADLE_PROJECT_android.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
            "ORG_GRADLE_PROJECT_android.injected.signing.key.password=$ANDROID_KEY_PASSWORD" \
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: 收集 APK
        run: |
          mkdir -p out/android
          # 版本从 mobile/app.json 读（别再写死——发新版客户端时 CI 自动跟随）
          AV=$(python3 -c "import json;print(json.load(open('mobile/app.json'))['expo']['version'])")
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/android/AI-EOS-Android-v${AV}.apk"
          ls -lh out/android/
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: out/android
          retention-days: 30

  # ---------- 汇总：发 Release + 挂全部安装包 ----------
  release:
    needs: [desktop-mac, desktop-win, desktop-linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 定标签
        id: tag
        run: |
          # 用户铁律：每个版本的 Release 必须挂客户端 → 用推送的 tag 名
          # （clients-v5.8.0）作 Release tag，不再回落日期标签
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"        # 例：clients-v5.8.0
          else
            TAG="${{ inputs.tag }}"             # workflow_dispatch 手动
            if [ -z "$TAG" ]; then TAG="clients-$(date +%Y%m%d)"; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: 创建 Release 并附安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: yimuhub/ai-eos
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          API="https://api.github.com/repos/$REPO"
          # 展平产物到 release-files/（文件名去重）
          mkdir -p release-files
          find artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.apk" \) \
            -exec sh -c 'f="${1}"; b="$(basename "$f")"; n=1; while [ -e "release-files/$b" ]; do base="${b%.${b##*.}}"; ext="${b##*.}"; b="${base}-${n}.${ext}"; n=$((n+1)); done; cp "$f" "release-files/$b"' _ {} \;
          ls -lh release-files/
          # 组装 notes 文件（RV：从安装包文件名提取最新版本号，别再写死 V5.x）
          RV=$(ls release-files/ | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          cat > release-notes.md <<EOF
          ## AI-EOS V${RV} 客户端

          | 平台 | 文件 | 安装方式 |
          |---|---|---|
          | macOS (Apple Silicon / Intel) | .dmg / .zip | 见下方「macOS 恶意软件拦截处理」；签名版可直接双击打开 |
          | Windows | AI-EOS Setup *.exe (NSIS) / AI-EOS-*.exe (绿色版) | 双击安装 / 解压直接运行；SmartScreen 点「仍要运行」 |
          | Linux | .AppImage（自包含）/ .deb | chmod +x 双击 / sudo dpkg -i |
          | Android | AI-EOS-Android-v${RV}.apk | 传到手机，允许「未知来源」后安装 |

          **macOS「恶意软件」拦截处理（重要）**
          - 未做 Apple 公证的 Mac 客户端，在 macOS（尤其 27）双击 .dmg 里的 app 可能被判定"恶意软件"并自动移入废纸篓。
          - **ad-hoc 包不会附带信任激活脚本，也不会安装系统受信任根。** 请仅从可信分发渠道获取安装包；确认来源后，按 macOS 提示选择“仍要打开”。不要运行要求把未知自签证书设为受信任根的脚本。
          - **应急（被删后、临时）**：终端执行 `sudo xattr -cr /Applications/AI-EOS.app && open /Applications/AI-EOS.app`。
          - **免警告分发（需 Apple Developer 账号）**：在 GitHub 仓库 Secrets 配
            `APPLE_CERTIFICATE / APPLE_CERT_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID`
            后重跑 clients 流水线，CI 自动 Developer ID 签名 + 公证，所有 Mac 开箱即用、无警告无删除。

          **桌面客户端使用说明**
          - Electron 壳：把 AI-EOS 前端装进原生窗口（界面与网页版完全一致，含全部功能页）。
          - 首次打开若显示「服务未检测到」引导页：先在你的服务器上启动 AI-EOS（便携版 / 一键部署），再点「重试连接」；远程服务点「更换服务器」填 `http://服务器IP:8000`。
          - 开发机仓库内 `npm start` 仍是自动拉起本地服务的原行为。

          **Android 使用说明**
          - 老板视角 App：KPI / 一句话下达（含📎）/ 签字门 / 服务连接。
          - 打开后到「连接」Tab 填服务器地址并登录（连接信息加密保存在手机里）。

          - 临时密钥库权限为 0600，并通过环境变量映射的 Gradle 属性传入；口令不作为命令行参数，也不打印到日志。
          EOF
          # 若同名 Release 已存在则先删（API）
          EXIST=$(curl -s -o /dev/null -w "%{http_code}" "$API/releases/tags/$TAG_NAME" -H "Authorization: token $GH_TOKEN")
          if [ "$EXIST" = "200" ]; then
            RID=$(curl -s "$API/releases/tags/$TAG_NAME" -H "Authorization: token $GH_TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
            curl -s -X DELETE "$API/releases/$RID" -H "Authorization: token $GH_TOKEN" -o /dev/null
            git tag -d "$TAG_NAME" 2>/dev/null || true
            git push origin ":$TAG_NAME" 2>/dev/null || true
          fi
          # 创建 Release（body 从 release-notes.md 内嵌进 JSON；$API/$TAG 由 shell 展开进 python 单行）
          python3 -c "import json,os,urllib.request as u,sys; body=open('release-notes.md').read(); payload={'tag_name':'$TAG_NAME','name':'AI-EOS V$RV 客户端（Mac/Windows/Linux/Android）','body':body,'draft':False,'prerelease':False}; req=u.Request('$API'+'/releases',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'token '+os.environ['GH_TOKEN'],'Content-Type':'application/json'}); rel=u.urlopen(req).read(); open('/tmp/release_id.txt','w').write(str(json.loads(rel)['id'])); print(rel[:300])"
          RID=$(cat /tmp/release_id.txt)
          echo "release id: $RID"
          # 逐个上传 assets（必须走 release 的 upload_url：uploads.github.com；
          # api.github.com/.../releases/{id}/assets 会 404）
          UPURL=$(curl -s "$API/releases/$RID" -H "Authorization: token $GH_TOKEN" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['upload_url'].split('{')[0])")
          echo "upload url: $UPURL"
          for f in release-files/*; do
            ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$(basename "$f")")
            curl -s -X POST "$UPURL?name=$ENC" \
              -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" -o /dev/null -w "upload $(basename "$f"): %{http_code}\n"
          done
