# AI-EOS 多平台客户端流水线（V5.1）
# 产出：Mac(dmg+zip) / Windows(nsis+portable) / Linux(AppImage+deb) / Android(发布版 APK)
# 触发：**仅手动**（workflow_dispatch）。
# 打包是 Actions 里最贵的一类任务（macOS/Windows runner × 多架构），密集开发期不随标签
# 自动触发。需要出安装包时到 Actions 页面手动 Run workflow 并填标签。
name: clients

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release 标签（留空自动生成 clients-<日期>）"
        required: false
        default: ""

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 桌面：macOS ----------
  desktop-mac:
    runs-on: macos-latest   # Apple Silicon runner，x64/arm64 双架构
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装依赖
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: 构建 dmg + zip（x64/arm64；Tier1 ad-hoc + 信任激活脚本）
        working-directory: desktop
        env:
          # ── 签名策略 ──
          # Tier 2（配了 Apple secrets）：Developer ID 签名 + Apple 公证 → 全 Mac 零接触
          #   APPLE_CERTIFICATE(base64 p12) / APPLE_CERT_PASSWORD / APPLE_ID /
          #   APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
          # Tier 1（默认，无 Apple 账号）：ad-hoc 构建 + 随附「信任激活脚本」
          #   （electron-builder 的 CSC_LINK 自签在 macOS 27 有 set-key-partition-list
          #     钥匙串 bug，CI 无法完成受信任自签 → 改由每台 Mac 用户跑一次激活脚本重签）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -n "$APPLE_CSC_LINK" ]; then
            echo "✅ 已配置 Apple 证书 → Developer ID 签名 + 公证（APPLE_ID / TeamID）"
            export CSC_LINK="$APPLE_CSC_LINK"
            export CSC_KEY_PASSWORD="$APPLE_CSC_KEY_PASSWORD"
            npx electron-builder --mac
          else
            echo "ℹ️ 未配置 Apple 证书 → ad-hoc 构建；每台 Mac 用户装完跑一次『AI-EOS-Mac-trust-activate.command』重签即可"
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac
          fi
      - name: 收集产物（含信任激活脚本）
        run: |
          mkdir -p out/mac
          cp desktop/dist/AI-EOS-*.dmg desktop/dist/AI-EOS-*.zip out/mac/ 2>/dev/null || cp desktop/dist/*.dmg desktop/dist/*.zip out/mac/ 2>/dev/null
          # 随附 Mac 信任激活脚本（无 Apple 账号时，每台 Mac 跑一次即可信任+重签）
          cp packaging/mac-signing/"AI-EOS-Mac-trust-activate.command" out/mac/ 2>/dev/null || echo "  (信任激活脚本缺失，跳过)"
          chmod +x out/mac/"AI-EOS-Mac-trust-activate.command" 2>/dev/null || true
          ls -lh out/mac/
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-mac
          path: out/mac
          retention-days: 14

  # ---------- 桌面：Windows ----------
  desktop-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装依赖
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: 构建 NSIS 安装器 + portable 绿色版
        working-directory: desktop
        run: npx electron-builder --win
      - name: 收集产物
        run: |
          New-Item -ItemType Directory -Force out/win | Out-Null
          Copy-Item desktop\dist\*.exe out/win/ -ErrorAction SilentlyContinue
          Get-ChildItem out/win | Format-Table Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-win
          path: out/win
          retention-days: 14

  # ---------- 桌面：Linux ----------
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装依赖
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: 构建 AppImage + deb
        working-directory: desktop
        run: npx electron-builder --linux
      - name: 收集产物
        run: |
          mkdir -p out/linux
          cp desktop/dist/*.AppImage desktop/dist/*.deb out/linux/ 2>/dev/null
          ls -lh out/linux/
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: out/linux
          retention-days: 14

  # ---------- Android：发布版 APK（自签 p12） ----------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 安装依赖
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: expo prebuild 生成原生工程
        working-directory: mobile
        run: npx expo prebuild -p android --no-install
      - name: 注入 release 签名配置（p12 自签）
        working-directory: mobile/android
        run: |
          python3 - <<'PY'
          import re, pathlib
          g = pathlib.Path("app/build.gradle")
          s = g.read_text()
          # 已有 signingConfigs 则跳过
          if "signingConfigs" not in s:
              # 在 android { 内追加 signingConfigs + buildTypes.release 引用
              anchor = "buildTypes {"
              i = s.index(anchor)
              block = (
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            storeFile file('../../packaging/keystore/ai-eos.p12')\n"
                  "            storeType 'p12'\n"
                  "            storePassword 'aieos2026'\n"
                  "            keyAlias 'aieos'\n"
                  "            keyPassword 'aieos2026'\n"
                  "        }\n"
                  "    }\n"
              )
              # 插到 buildTypes 块前
              s = s[:i] + block + s[i:]
              # release 加 signingConfig
              s = s.replace("release {", "release {\n                signingConfig signingConfigs.release", 1)
          g.write_text(s)
          print("build.gradle 签名配置注入完成")
          PY
      - name: gradle 构建 release APK
        working-directory: mobile/android
        run: |
          yes | ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: 收集 APK
        run: |
          mkdir -p out/android
          # 版本从 mobile/app.json 读（别再写死——发新版客户端时 CI 自动跟随）
          AV=$(python3 -c "import json;print(json.load(open('mobile/app.json'))['expo']['version'])")
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/android/AI-EOS-Android-v${AV}.apk"
          ls -lh out/android/
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: out/android
          retention-days: 30

  # ---------- 汇总：发 Release + 挂全部安装包 ----------
  release:
    needs: [desktop-mac, desktop-win, desktop-linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 定标签
        id: tag
        run: |
          # 用户铁律：每个版本的 Release 必须挂客户端 → 用推送的 tag 名
          # （clients-v5.8.0）作 Release tag，不再回落日期标签
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"        # 例：clients-v5.8.0
          else
            TAG="${{ inputs.tag }}"             # workflow_dispatch 手动
            if [ -z "$TAG" ]; then TAG="clients-$(date +%Y%m%d)"; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: 创建 Release 并附安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: yimuhub/ai-eos
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          API="https://api.github.com/repos/$REPO"
          # 展平产物到 release-files/（文件名去重）
          mkdir -p release-files
          find artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.apk" -o -name "*.command" \) \
            -exec sh -c 'f="${1}"; b="$(basename "$f")"; n=1; while [ -e "release-files/$b" ]; do base="${b%.${b##*.}}"; ext="${b##*.}"; b="${base}-${n}.${ext}"; n=$((n+1)); done; cp "$f" "release-files/$b"' _ {} \;
          ls -lh release-files/
          # 组装 notes 文件（RV：从安装包文件名提取最新版本号，别再写死 V5.x）
          RV=$(ls release-files/ | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          cat > release-notes.md <<EOF
          ## AI-EOS V${RV} 客户端

          | 平台 | 文件 | 安装方式 |
          |---|---|---|
          | macOS (Apple Silicon / Intel) | .dmg / .zip | 见下方「macOS 恶意软件拦截处理」；签名版可直接双击打开 |
          | Windows | AI-EOS Setup *.exe (NSIS) / AI-EOS-*.exe (绿色版) | 双击安装 / 解压直接运行；SmartScreen 点「仍要运行」 |
          | Linux | .AppImage（自包含）/ .deb | chmod +x 双击 / sudo dpkg -i |
          | Android | AI-EOS-Android-v${RV}.apk | 传到手机，允许「未知来源」后安装 |

          **macOS「恶意软件」拦截处理（重要）**
          - 未做 Apple 公证的 Mac 客户端，在 macOS（尤其 27）双击 .dmg 里的 app 可能被判定"恶意软件"并自动移入废纸篓。
          - **首选（无需 Apple 账号）：运行随附的 `AI-EOS-Mac-trust-activate.command`**
            ① 先用 .dmg 把 AI-EOS 拖进 应用程序（被删就重拖一份）；
            ② 双击 `AI-EOS-Mac-trust-activate.command`，按提示完成一次 Touch ID / 密码；
            ③ 脚本会自动把自签证书设为受信任根并重签 /Applications/AI-EOS.app；
            ④ 之后双击 AI-EOS 即可打开（首次若提示"未识别开发者"，点"仍要打开"一次）。
            每台 Mac 只需跑一次。
          - **应急（被删后、临时）**：终端执行 `sudo xattr -cr /Applications/AI-EOS.app && open /Applications/AI-EOS.app`。
          - **彻底零接触（需 Apple 账号，$99/年）**：在 GitHub 仓库 Secrets 配
            `APPLE_CERTIFICATE / APPLE_CERT_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID`
            后重跑 clients 流水线，CI 自动 Developer ID 签名 + 公证，所有 Mac 开箱即用、无警告无删除。

          **桌面客户端使用说明**
          - Electron 壳：把 AI-EOS 前端装进原生窗口（界面与网页版完全一致，含全部功能页）。
          - 首次打开若显示「服务未检测到」引导页：先在你的服务器上启动 AI-EOS（便携版 / 一键部署），再点「重试连接」；远程服务点「更换服务器」填 `http://服务器IP:8000`。
          - 开发机仓库内 `npm start` 仍是自动拉起本地服务的原行为。

          **Android 使用说明**
          - 老板视角 App：KPI / 一句话下达（含📎）/ 签字门 / 服务连接。
          - 打开后到「连接」Tab 填服务器地址并登录（连接信息加密保存在手机里）。

          安装包均为内部自签（未做 Apple/Windows 公证），分发给自己/团队设备时按系统提示放行即可。
          EOF
          # 若同名 Release 已存在则先删（API）
          EXIST=$(curl -s -o /dev/null -w "%{http_code}" "$API/releases/tags/$TAG_NAME" -H "Authorization: token $GH_TOKEN")
          if [ "$EXIST" = "200" ]; then
            RID=$(curl -s "$API/releases/tags/$TAG_NAME" -H "Authorization: token $GH_TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
            curl -s -X DELETE "$API/releases/$RID" -H "Authorization: token $GH_TOKEN" -o /dev/null
            git tag -d "$TAG_NAME" 2>/dev/null || true
            git push origin ":$TAG_NAME" 2>/dev/null || true
          fi
          # 创建 Release（body 从 release-notes.md 内嵌进 JSON；$API/$TAG 由 shell 展开进 python 单行）
          python3 -c "import json,os,urllib.request as u,sys; body=open('release-notes.md').read(); payload={'tag_name':'$TAG_NAME','name':'AI-EOS V$RV 客户端（Mac/Windows/Linux/Android）','body':body,'draft':False,'prerelease':False}; req=u.Request('$API'+'/releases',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'token '+os.environ['GH_TOKEN'],'Content-Type':'application/json'}); rel=u.urlopen(req).read(); open('/tmp/release_id.txt','w').write(str(json.loads(rel)['id'])); print(rel[:300])"
          RID=$(cat /tmp/release_id.txt)
          echo "release id: $RID"
          # 逐个上传 assets（必须走 release 的 upload_url：uploads.github.com；
          # api.github.com/.../releases/{id}/assets 会 404）
          UPURL=$(curl -s "$API/releases/$RID" -H "Authorization: token $GH_TOKEN" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['upload_url'].split('{')[0])")
          echo "upload url: $UPURL"
          for f in release-files/*; do
            ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$(basename "$f")")
            curl -s -X POST "$UPURL?name=$ENC" \
              -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" -o /dev/null -w "upload $(basename "$f"): %{http_code}\n"
          done
